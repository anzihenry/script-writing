name: Pipeline regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.15'
          - os: macos-latest
            python: '3.15'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Scale measurement
        run: python scripts/benchmark_pipeline.py
      - name: Example replay
        run: python scripts/validate_examples.py
